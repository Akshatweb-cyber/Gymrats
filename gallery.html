<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TRAINING GROUND GALLERY | IRON PARADISE</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.92)), url('watermarked_img_8845503231115934402.png'); background-size: cover; background-attachment: fixed; color: white; font-family: 'Amatic SC', cursive; text-align: center; }
        nav { padding: 40px; background: rgba(0,0,0,0.95); border-bottom: 4px solid #ff3e3e; }
        nav a { color: white; margin: 0 25px; font-size: 3.5rem; text-decoration: none; font-weight: bold; }
        h1 { font-size: 10rem; color: #ff3e3e; padding: 60px 0 20px; }
        .gallery-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 40px; padding: 50px; max-width: 1400px; margin: 0 auto; }
        .img-card { border: 4px solid #ff3e3e; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.7); transition: 0.4s; }
        .img-card:hover { transform: scale(1.05) rotate(1deg); border-color: white; }
        .img-card img { width: 100%; height: 400px; object-fit: cover; display: block; filter: grayscale(40%) contrast(120%); }
    </style>
</head>

    <nav>
        <a href="index.html">Home</a><a href="services.html">Services</a><a href="plans.html">Plans</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a>

    <h1 class="animate__animated animate__zoomIn">VISUAL POWERHOUSE</h1>

        <div class="img-card animate__animated animate__jackInTheBox animate__delay-1s"><img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48" alt="Power Rack"></div>
        <div class="img-card animate__animated animate__jackInTheBox animate__delay-2s"><img src="https://images.unsplash.com/photo-1540206276907-fbd6cd1a28a6" alt="Heavy Weight"></div>
    </div>
